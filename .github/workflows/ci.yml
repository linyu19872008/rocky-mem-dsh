name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: for f in lib/*.js scripts/*.mjs test/*.mjs; do node --check "$f"; done

      - name: Unit tests
        run: node --test test/*.test.mjs

      # A bundle that forgets the patch, the icon, or a runtime file installs and
      # then does nothing. Assert the shipped list instead of trusting `files`.
      - name: Package contents
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const raw = require("/tmp/pack.json");
            const entry = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            const files = entry.files.map((f) => f.path);
            const required = [
              "package.json",
              "cordis.patch.yml",
              "lib/index.js",
              "lib/inject.js",
              "lib/message.js",
              "lib/client.js",
              "lib/skill.js",
              "docs/DETAIL.md",
              "assets/brand/icon-256.png",
              "locale/en.json",
              "locale/zh-CN.json",
            ];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length) {
              console.error("missing from the package:", missing);
              process.exit(1);
            }
            console.log("package contents ok:", files.length, "files");
          '

      - name: Market entry is a valid format-1 index
        run: |
          node scripts/gen-market-entry.mjs --index --out /tmp/index.json
          node -e "
            const j = require('/tmp/index.json');
            if (j.format !== 1) throw new Error('format');
            if (!Array.isArray(j.plugins) || j.plugins.length !== 1) throw new Error('plugins');
            const p = j.plugins[0];
            if (!p.name || !p.versions?.[0]?.source) throw new Error('entry');
            if (!p.icon?.endsWith('.png')) throw new Error('icon must be a raster');
            console.log('market entry ok:', p.name, p.versions[0].version);
          "
