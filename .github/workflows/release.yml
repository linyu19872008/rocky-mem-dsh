name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Secrets are not exposed to `if` expressions, so surface the token as an
    # env value and branch on that instead.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Assert tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      - name: Assert the bundle patch and manifest agree
        run: |
          grep -q "name: rocky-mem-dsh" cordis.patch.yml
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1)"

      - name: Syntax check
        run: for f in lib/*.js scripts/*.mjs; do node --check "$f"; done

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Note the skipped publish
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN is unset, so this tag does not publish; publish manually or add the secret."

      - name: Generate index entry
        run: node scripts/gen-market-entry.mjs --index --out dist/index.json

      - name: Upload index artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: market-index
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
